name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "pomme-android/**"
      - "pomme-client/**"
      - "pomme-auth/**"
      - "pomme-install/**"
      - "pomme-protocol/**"
      - "pomme-dirs/**"
      - "pomme-block/**"
      - "pomme-gpu-allocator/**"
      - "third_party/**"
      - "tools/build_openal.py"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build arm64 debug APK
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          accept-android-sdk-licenses: true

      - name: Install Android SDK components
        run: |
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
          

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang cmake ninja-build pkg-config

      - name: Install Rust Android target
        run: |
          rustup target add aarch64-linux-android
          cargo install cargo-ndk

      - name: Build OpenAL
        run: python3 tools/build_openal.py android pomme-android/app/src/main/jniLibs/arm64-v8a

      - name: Build Rust library
        run: cargo ndk -t arm64-v8a -o pomme-android/app/src/main/jniLibs build -p pomme-android

      - name: Build APK
        working-directory: pomme-android
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pomme-android-debug-apk
          path: pomme-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
